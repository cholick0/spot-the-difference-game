<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spot the Difference — Lantern Harbour</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #141021; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game {
    display: block;
    width: min(100vw, calc(100vh * 1280 / 720));
    height: min(100vh, calc(100vw * 720 / 1280));
    touch-action: none;
    cursor: crosshair;
    background: #141021;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="1280" height="720" aria-label="Spot the Difference: two near-identical pictures side by side. Click a difference to mark it."></canvas>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
